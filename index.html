<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Невинномысск 3D</title>
    <meta name="description" content="Nevinnomyssk, Stavropol Krai — the whole city recreated in real-time 3D from open geodata." />
    <style>
      :root { color-scheme: dark; --fg: #eef2f6; --muted: #9fb0c0; --accent: #7cc4ff; --bg: #0b1016; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #ui-root > * { pointer-events: auto; }
      body.shot #ui-root { display: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #16212c, #06090d);
        z-index: 10; transition: opacity 1s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .box { width: min(420px, 86vw); text-align: center; }
      #loading h1 { font-weight: 300; letter-spacing: .08em; margin: 0 0 4px; font-size: 32px; }
      #loading p { margin: 0 0 18px; color: var(--muted); }
      #loading .track { height: 3px; background: #ffffff1a; border-radius: 2px; overflow: hidden; }
      #loading-bar { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
      #loading-status { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 1.4em; }
      body.shot #loading { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-root"></div>
    <div id="loading">
      <div class="box">
        <h1>НЕВИННОМЫССК</h1>
        <p>Nevinnomyssk · 3D</p>
        <div class="track"><div id="loading-bar"></div></div>
        <div id="loading-status">Starting…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
